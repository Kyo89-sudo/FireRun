name: Build FireRun

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # La chiave di firma arriva dai Secrets del repository (Settings → Secrets and variables → Actions)
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Manca il secret KEYSTORE_BASE64: aggiungilo in Settings → Secrets and variables → Actions (vedi README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firerun-release.jks"

      # GITHUB_RUN_NUMBER diventa versionCode (vedi app/build.gradle)
      - name: Compila APK
        env:
          FIRERUN_KEYSTORE: ${{ runner.temp }}/firerun-release.jks
          FIRERUN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Elimina la chiave dal runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firerun-release.jks"

      - name: Prepara i file della release
        run: |
          cp app/build/outputs/apk/release/app-release.apk FireRun.apk
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: FireRun-1.0.${{ github.run_number }}
          path: |
            FireRun.apk
            version.json

      # Ogni build è una release: i link .../releases/latest/download/... puntano sempre all'ultima.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FireRun 1.0.${{ github.run_number }}
          body: Build automatica dal commit ${{ github.sha }}
          files: |
            FireRun.apk
            version.json
          make_latest: true
